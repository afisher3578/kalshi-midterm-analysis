# Media Cloud search criteria for the Texas Senate race (docs/mediacloud-search-criteria.md, section 9 shape).
# Loaded and validated by raceattn/mcqueries.py. The config hash is computed from the parsed values, so comments
# do not change it; any change to a value does. After the freeze, log every change under changes_log and bump
# `version`.
version: 1
status: draft            # draft | tuned | frozen
frozen_on: null
race_id: tx-senate-2026
language: en
platform: onlinenews-mediacloud
api_version: "3.2.3"     # GET https://search.mediacloud.org/api/version, 2026-11-12 (GIT_REV cf92de2e)
timezone_note: "publish_date is a date with no time or timezone (Media Cloud Story Guide); days are the extracted publish date, not UTC days"
collections:
  # Both confirmed live on 2026-11-12: national from GET sources/collections/34412234/ (platform online_news,
  # public, featured), texas_local from `python -m raceattn mediacloud collections --state TX` (the only match).
  national: {name: "United States - National", id: 34412234, source_count: 246, looked_up_on: 2026-11-12}
  texas_local: {name: "Texas, United States - State & Local", id: 38381323, source_count: 593, looked_up_on: 2026-11-12}
phases:
  tuning:   {start: 2026-08-01, end: 2026-08-24}
  baseline: {start: 2026-08-25, end: 2026-08-31}
  analysis: {start: 2026-09-01, end: 2026-11-02}
  election: {start: 2026-11-03, end: 2026-11-04}
# The seven queries from section 4, logic as drafted. Syntax adaptation, logic unchanged: every query is the
# drafted base query wrapped in parentheses, then ` AND language:en`, so the language clause applies to the whole
# query (paxton_race ends in a NOT clause, and the compositions mix AND and OR).
queries:
  talarico_race: '(("James Talarico" OR Talarico) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR poll OR polls OR debate OR Paxton)) AND language:en'
  paxton_race: '(("Ken Paxton" OR "Kenneth Paxton" OR Paxton) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR runoff OR poll OR polls OR debate OR Cornyn OR Talarico) NOT "Bill Paxton") AND language:en'
  # race_either = (talarico_race) OR (paxton_race), language:en once at the end
  race_either: '((("James Talarico" OR Talarico) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR poll OR polls OR debate OR Paxton)) OR (("Ken Paxton" OR "Kenneth Paxton" OR Paxton) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR runoff OR poll OR polls OR debate OR Cornyn OR Talarico) NOT "Bill Paxton")) AND language:en'
  # race_both = (talarico_race) AND (paxton_race), language:en once at the end (head-to-head coverage)
  race_both: '((("James Talarico" OR Talarico) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR poll OR polls OR debate OR Paxton)) AND (("Ken Paxton" OR "Kenneth Paxton" OR Paxton) AND (Senate OR "U.S. Senate" OR "Senate race" OR campaign OR election OR candidate OR nominee OR runoff OR poll OR polls OR debate OR Cornyn OR Talarico) NOT "Bill Paxton")) AND language:en'
  talarico_any: '(("James Talarico" OR Talarico)) AND language:en'
  paxton_any: '(("Ken Paxton" OR "Kenneth Paxton" OR Paxton) NOT "Bill Paxton") AND language:en'
  # headline prominence; the article_title grammar was confirmed live on 2026-11-12 (the grouped form applies the
  # field to every term in the group)
  headline_either: '(article_title:(Talarico OR "Ken Paxton" OR Paxton) AND (Senate OR Talarico OR Paxton OR campaign OR poll)) AND language:en'
  # derived support (not one of the seven): the union of the two any-mention queries, the denominator of
  # core_vs_broad. It has to be its own count because a union cannot be computed from two counts.
  # any_either = (talarico_any) OR (paxton_any), language:en once at the end
  any_either: '((("James Talarico" OR Talarico)) OR (("Ken Paxton" OR "Kenneth Paxton" OR Paxton) NOT "Bill Paxton")) AND language:en'
# The validator re-renders these from the base queries and fails if the strings above drift from them.
compositions:
  race_either: {op: OR, of: [talarico_race, paxton_race]}
  race_both: {op: AND, of: [talarico_race, paxton_race]}
  any_either: {op: OR, of: [talarico_any, paxton_any]}
derived_support: [any_either]
# Derived series, computed per collection and per day (section 4). A zero denominator gives null with a reason.
derived:
  talarico_share: {kind: share, numerator: talarico_race, other: paxton_race}
  talarico_exclusive_share: {kind: exclusive_share, numerator: talarico_race, other: paxton_race, both: race_both}
  core_vs_broad: {kind: ratio, numerator: race_either, denominator: any_either}
exclusions_log: []        # each added exclusion: term, date, the false matches seen
changes_log: []           # after the freeze: date, what changed, why, new version
# Findings from the live API before the freeze (no query or logic change). Not read by the validator.
notes:
  - {date: 2026-11-12, note: "Syntax checked live: article_title:(A OR B) gives the same count as (article_title:A OR article_title:B); language:en inside q is accepted and filters (language:fr gives 0)."}
  - {date: 2026-11-12, note: "No query syntax changes needed; the seven queries and any_either stay as drafted."}
  - {date: 2026-11-12, note: "Collections looked up live: national 34412234 (246 sources), texas_local 38381323 (593 sources)."}
  - {date: 2026-11-12, note: "publish_date is a date only, no time or timezone (Media Cloud Story Guide); days are the extracted publish date, not UTC days."}
  - {date: 2026-11-12, note: "GET search/api-params gives query-rate 2/m for search endpoints; the 30 s pace fits. No rate-limit headers."}
audit:
  core_queries: [talarico_race, paxton_race]   # the main series (section 4); see docs/mc1-notes.md
  per_query_per_collection: 100
  precision_target: 0.90
  reliability_targets: {agreement: report, krippendorff_alpha: 0.80, drop_below: 0.70}
